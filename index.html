<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="OMNI-AUDIT - Framework automatizado de defensa cibernética y auditoría de vulnerabilidades web OWASP Top 10.">
    <meta name="keywords" content="OMNI-AUDIT, cyber defense framework, auditoria web, scanner vulnerabilidades, OWASP, pentesting, seguridad de la informacion">
    <meta name="robots" content="index, follow">
    <meta name="author" content="OMNI-AUDIT Developers">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src https://cdnjs.cloudflare.com https://fonts.gstatic.com; connect-src https://*.firebaseio.com https://*.googleapis.com;">
    <meta http-equiv="X-Frame-Options" content="DENY">
    
    <title>OMNI-AUDIT | Cyber Defense Framework</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        :root {
            --bg-principal: #070a12;
            --bg-tarjeta: #0f172a;
            --bg-alerta: #0b1329;
            --cian-neon: #00f2fe;
            --verde-neon: #10b981;
            --rojo-alerta: #ef4444;
            --texto-blanco: #f3f4f6;
            --texto-mutado: #9ca3af;
            --borde: #1e293b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-principal);
            color: var(--texto-blanco);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--borde);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
        }

        .logo-circular {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid var(--cian-neon);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #0f172a 0%, #070a12 100%);
            position: relative;
        }

        .logo-circular .fa-user-secret {
            font-size: 1.4rem;
            color: var(--texto-blanco);
            z-index: 1;
        }

        .logo-circular .fa-magnifying-glass {
            font-size: 0.75rem;
            color: var(--cian-neon);
            position: absolute;
            right: 8px;
            bottom: 8px;
            z-index: 2;
            background: var(--bg-principal);
            border-radius: 50%;
            padding: 2px;
            box-shadow: 0 0 5px var(--cian-neon);
        }

        .logo-texto {
            display: flex;
            flex-direction: column;
        }

        .logo-titulo {
            font-family: 'Fira Code', monospace;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--texto-blanco);
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .logo-subtitulo {
            font-size: 0.75rem;
            color: var(--cian-neon);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .buscador-container {
            position: relative;
            width: 320px;
        }

        .buscador-container input {
            width: 100%;
            padding: 0.6rem 1rem 0.6rem 2.5rem;
            background-color: var(--bg-principal);
            border: 1px solid var(--borde);
            border-radius: 8px;
            color: var(--texto-blanco);
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .buscador-container input:focus {
            outline: none;
            border-color: var(--cian-neon);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        .buscador-container i {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--texto-mutado);
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
            flex: 1;
        }

        .hero {
            text-align: center;
            margin-bottom: 4rem;
            margin-top: 1.5rem;
        }

        .hero h1 {
            font-size: 2.8rem;
            margin-bottom: 1rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--texto-blanco), var(--texto-mutado));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--texto-mutado);
            font-size: 1.1rem;
            max-width: 700px;
            margin: 0 auto;
        }

        .seccion-programas {
            margin-bottom: 4rem;
        }

        .programa-detallado {
            background-color: var(--bg-tarjeta);
            border: 1px solid var(--borde);
            border-radius: 12px;
            padding: 2.5rem;
            margin-bottom: 3rem;
            transition: border-color 0.3s ease;
        }

        .programa-detallado:hover {
            border-color: rgba(0, 242, 254, 0.4);
        }

        .programa-meta {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid var(--borde);
            padding-bottom: 1.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .programa-titulo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .programa-titulo i {
            font-size: 2.2rem;
            color: var(--cian-neon);
        }

        .programa-titulo h2 {
            margin: 0;
            font-size: 1.8rem;
        }

        .funcionalidades-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .funcionalidad-item {
            background-color: rgba(7, 10, 18, 0.5);
            border: 1px solid var(--borde);
            padding: 1.2rem;
            border-radius: 8px;
        }

        .funcionalidad-item h4 {
            margin: 0 0 0.5rem 0;
            color: var(--cian-neon);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .funcionalidad-item p {
            margin: 0;
            font-size: 0.9rem;
            color: var(--texto-mutado);
            line-height: 1.5;
        }

        .tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tag {
            background-color: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--borde);
            padding: 0.3rem 0.7rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-family: 'Fira Code', monospace;
            color: var(--cian-neon);
        }

        .btn-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(0, 242, 254, 0.08);
            border: 1px solid var(--cian-neon);
            color: var(--texto-blanco);
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-link:hover {
            background: linear-gradient(135deg, var(--cian-neon), var(--verde-neon));
            color: var(--bg-principal);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        .disclaimer-box {
            background-color: var(--bg-alerta);
            border-left: 4px solid var(--rojo-alerta);
            border-top: 1px solid var(--borde);
            border-right: 1px solid var(--borde);
            border-bottom: 1px solid var(--borde);
            padding: 1.5rem;
            border-radius: 8px;
            margin-top: 4rem;
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }

        .disclaimer-box i {
            font-size: 1.5rem;
            color: var(--rojo-alerta);
            margin-top: 0.2rem;
        }

        .disclaimer-box h3 {
            margin: 0 0 0.5rem 0;
            color: var(--texto-blanco);
            font-size: 1.1rem;
        }

        .disclaimer-box p {
            margin: 0;
            color: var(--texto-mutado);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .seccion-legal {
            background-color: rgba(15, 23, 42, 0.4);
            border: 1px dashed var(--borde);
            border-radius: 12px;
            padding: 2rem;
        }

        .seccion-legal h3 {
            margin-top: 0;
            color: var(--verde-neon);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .seccion-legal p {
            font-size: 0.9rem;
            color: var(--texto-mutado);
            line-height: 1.6;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--texto-mutado);
            font-size: 0.85rem;
            border-top: 1px solid var(--borde);
            background-color: rgba(15, 23, 42, 0.2);
        }

        /* 🗝️ Estilos del Modal Flotante de Login (Oculto por defecto con display: none) */
        #login-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 10, 18, 0.85);
            backdrop-filter: blur(8px);
            z-index: 999;
            display: none; /* Se activa dinámicamente con JavaScript */
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #0f172a;
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid #1e293b;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.15);
            position: relative;
        }

        .close-modal-btn {
            position: absolute;
            top: 1rem;
            right: 1.2rem;
            background: none;
            border: none;
            color: var(--texto-mutado);
            font-size: 1.2rem;
            cursor: pointer;
        }
        .close-modal-btn:hover {
            color: var(--rojo-alerta);
        }

        .login-input {
            width: 100%;
            padding: 0.7rem;
            background: #070a12;
            border: 1px solid #1e293b;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-family: inherit;
        }
        .login-input:focus {
            outline: none;
            border-color: var(--cian-neon);
        }
    </style>
</head>
<body>

    <div id="login-modal">
        <div class="login-card">
            <button class="close-modal-btn" onclick="cerrarModal()"><i class="fa-solid fa-xmark"></i></button>
            <div style="width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--cian-neon); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem auto; background: #070a12; box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);">
                <i class="fa-solid fa-user-secret" style="color: var(--cian-neon); font-size: 1.6rem;"></i>
            </div>
            <h2 style="margin: 0 0 0.5rem 0; font-family: 'Fira Code', monospace; font-size: 1.5rem;">Autenticación Requerida</h2>
            <p style="color: #9ca3af; font-size: 0.85rem; margin-bottom: 2rem;">Inicie sesión para descargar u obtener acceso al código fuente de la suite.</p>
            
            <form id="login-form" style="display: flex; flex-direction: column; gap: 1rem; text-align: left;">
                <div>
                    <label style="font-size: 0.8
